<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI cat — generated, auto-rigged, animated</title>
<style>
  html,body{margin:0;height:100%;background:#f4f1ec;font:14px/1.5 ui-sans-serif,system-ui,sans-serif;color:#5b544a}
  canvas{display:block}
  #hud{position:fixed;left:16px;bottom:14px;opacity:.75}
  #hud b{color:#2f2b26}
  #load{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
</style>
<div id="load">loading…</div>
<div id="hud"><b>AI-generated → auto-rigged (24 bones) → idle loop</b><br>drag to orbit · scroll to zoom</div>
<script type="importmap">{"imports":{
 "three":"https://unpkg.com/three@0.170.0/build/three.module.js",
 "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0xf4f1ec);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.AgXToneMapping; renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x8a8375,2.0));
const key=new THREE.DirectionalLight(0xffffff,1.7); key.position.set(-3,4,3); scene.add(key);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.enablePan=false;
controls.minDistance=1.5; controls.maxDistance=12;

let mixer;
new GLTFLoader().load('cat_idle.glb',gltf=>{
  const root=gltf.scene;
  const box=new THREE.Box3().setFromObject(root);
  const size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  const s=2.2/Math.max(size.x,size.y,size.z);
  root.scale.setScalar(s);
  root.position.sub(center.multiplyScalar(s));
  scene.add(root);

  mixer=new THREE.AnimationMixer(root);
  gltf.animations.forEach(c=>mixer.clipAction(c).play());

  camera.position.set(-6.2,0.7,0);
  controls.target.set(0,-0.15,0); controls.update();
  document.getElementById('load').remove();
},undefined,e=>{document.getElementById('load').textContent='failed to load model';console.error(e)});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  if(mixer) mixer.update(clock.getDelta());
  controls.update(); renderer.render(scene,camera);
});
</script>
